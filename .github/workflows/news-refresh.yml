# Hourly news refresh.
# Vercel's free (Hobby) plan only allows daily cron jobs, so GitHub Actions calls the
# ingestion endpoint every hour instead. vercel.json keeps a daily run as a backup.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SITE_URL     e.g. https://worldpulse.vercel.app (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
name: News refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run news ingestion
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL or CRON_SECRET secret is missing; skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/cron/ingest")
          echo "HTTP $status"
          cat response.json; echo
          test "$status" = "200"
